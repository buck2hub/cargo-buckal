[package]
name = "cargo-buckal"
version = "0.1.4"
edition = "2024"
authors = ["jl.jiang <jiangjl9807@gmail.com>"]
description = "Seamlessly build Cargo projects with Buck2."
documentation = "https://buck2hub.com/docs"
exclude = ["/.github"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/buck2hub/cargo-buckal"
keywords = ["buck2", "build", "cargo", "plugin", "subcommand"]
categories = [
  "command-line-utilities",
  "development-tools",
  "development-tools::cargo-plugins",
  "development-tools::build-utils",
]

[dependencies]
allocative = "0.3.6"
anyhow = "1.0.100"
bincode-next = { version = "3.1.1", features = ["serde"] }
bitflags = "2.10.0"
blake3 = "1.8.2"
cargo-platform = "0.3.0"
cargo-util-schemas = "0.14.2"
cargo_metadata = "0.23.1"
clap = { version = "4.5.41", features = ["derive"] }
colored = "3.1.1"
daggy = "0.9"
fs_extra = "1.3.0"
globset = "0.4.18"
hex = "0.4.3"
home = "0.5.12"
include_dir = "0.7.4"
indicatif = "0.18.3"
indoc = "2.0.6"
inquire = "0.9.4"
itertools = "0.15.0"
log = "0.4"
phf = { version = "0.14.0", features = ["macros"] }
regex = "1.11.2"
reqwest = { version = "0.13.4", features = ["json", "blocking", "query"] }
rust-ini = "0.21"
ruzstd = "0.9.0"
semver = "1.0.26"
serde = "1.0.219"
serde_derive = "1.0.219"
serde_json = "1.0.143"
serde_starlark = "0.1.17"
sha1 = "0.11.0"
sha2 = "0.11.0"
starlark_syntax = "0.14.2"
toml = "1.1.5"
toml_edit = "0.25.13"
url = "2.5.8"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3"
